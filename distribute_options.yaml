variables:
  PODCAST_INDEX_API_KEY: ${PODCAST_INDEX_API_KEY}

  PODCAST_INDEX_API_SECRET: ${PODCAST_INDEX_API_SECRET}
  PODCAST_USER_AGENT: "SomethingAwesome/1.0.1"

  NEON_DATABASE_URL: ${NEON_DATABASE_URL}

  GOOGLE_API_KEY: ${GOOGLE_API_KEY}

  OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
  OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}

  FYYD_CLIENT_ID: ${FYYD_CLIENT_ID}
  FYYD_CLIENT_SECRET: ${FYYD_CLIENT_SECRET}"

  FYYD_ACCESS_TOKEN: ${FYYD_ACCESS_TOKEN}
  FYYD_USER_ACCESS_TOKEN: ${FYYD_USER_ACCESS_TOKEN}

  TADDY_API_KEY: ${TADDY_API_KEY}
  TADDY_USER_ID: ${TADDY_USER_ID}

  PAYPAL_URL: ${PAYPAL_URL}

  BUY_ME_A_COFFEE_URL: ${BUY_ME_A_COFFEE_URL}

  DONATE_WITH_KOFI_URL: ${DONATE_WITH_KOFI_URL}

  DISCORD_URL: "https://discord.gg/cxy9AmMaYS"

  URL_GITHUB_ISSUES: "https://github.com/OpenAir-Podcast/OpenAir/issues"

  URL_GITHUB_DISCUSSION: "https://github.com/OpenAir-Podcast/OpenAir/discussions/categories/q-a"

  GITHUB_PROJECT_URL: "https://github.com/OpenAir-Podcast/OpenAir"

  PRIVACY_POLICY_URL: "https://github.com/OpenAir-Podcast/OpenAir/blob/main/privacy_policy.md"

  TERMS_OF_SERVICE_URL: "https://github.com/OpenAir-Podcast/OpenAir/blob/main/terms_of_service.md"

  APP_UNIQUE_ID: "com.openair.podcast"
  APP_GUID: ${APP_GUID}

output: dist/
releases:
  - name: dev
    jobs:
      - name: release-dev-android
        package:
          platform: android
          target: apk
          build_args:
            target-platform: android-arm,android-arm64
            dart-define:
              APP_ENV: dev

      - name: release-dev-windows
        package:
          platform: windows
          target: exe
          build_args:
            dart-define:
              APP_ENV: dev

      - name: release-dev-linux-appimage
        package:
          platform: linux
          target: appimage
          make_args:
            app_name: OpenAir
            executable_name: OpenAir
            icon: assets/icons/icon.png
            desktop_entry: linux/com.openair.podcast.desktop
          build_args:
            dart-define:
              APP_ENV: dev
